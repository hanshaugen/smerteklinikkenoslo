name: Republish on hanshaugen.com

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Ask hanshaugen.com to rebuild
        env:
          TOKEN: ${{ secrets.HANSHAUGEN_PAT }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::warning::HANSHAUGEN_PAT mangler. Repoet er oppdatert, men hanshaugen.com bygges ikke på nytt før hemmeligheten er lagt inn."
            exit 0
          fi
          curl --fail-with-body -sS -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/hanshaugen/hanshaugen/dispatches \
            -d '{"event_type":"clinic-updated"}'
